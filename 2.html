<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tribo Retenção</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #dcecf2;
    }

    .slide {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 76% 38%,
          rgba(255, 248, 220, 0.92) 0%,
          rgba(246, 243, 219, 0.65) 16%,
          rgba(215, 238, 240, 0.28) 34%,
          transparent 55%
        ),
        radial-gradient(
          circle at 55% 80%,
          rgba(167, 217, 230, 0.55) 0%,
          rgba(179, 220, 231, 0.30) 30%,
          transparent 58%
        ),
        linear-gradient(
          115deg,
          #78b9da 0%,
          #9dcee3 28%,
          #c6e1ea 53%,
          #e5e9dd 77%,
          #f3ebcf 100%
        );
    }

    /* leve névoa */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.03),
          rgba(255,255,255,0.08)
        );
      pointer-events: none;
    }

    /* BORDA PRINCIPAL */
    .frame {
      position: absolute;
      inset: 3.5%;
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 34px;
    }

    /* canto superior esquerdo */
    .corner-left {
      position: absolute;
      width: 145px;
      height: 145px;
      top: -14px;
      left: -1px;
      border-right: 1.4px solid rgba(255,255,255,0.55);
      border-bottom: 1.4px solid rgba(255,255,255,0.55);
      border-bottom-right-radius: 55px;
    }

    /* canto inferior direito */
    .corner-right {
      position: absolute;
      width: 150px;
      height: 150px;
      right: -1px;
      bottom: -8px;
      border-left: 1.4px solid rgba(255,255,255,0.55);
      border-top: 1.4px solid rgba(255,255,255,0.55);
      border-top-left-radius: 55px;
    }

    /* TEXTO SUPERIOR */
    .top-line {
      position: absolute;
      top: 8.8%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;

      color: #233d75;
      font-size: clamp(11px, 1.05vw, 18px);
      font-weight: 400;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    /* TÍTULO */
    .title {
      position: absolute;
      left: 8.6%;
      top: 22.4%;
      color: #263870;
    }

    .title .tribo {
      font-size: clamp(34px, 4.5vw, 74px);
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }

    .title .retencao {
      margin-top: 8px;
      font-size: clamp(46px, 5.8vw, 94px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.055em;
    }

    /* TEXTO INFERIOR */
    .bottom-line {
      position: absolute;
      bottom: 7.3%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;

      color: #233d75;
      font-size: clamp(11px, 1.05vw, 18px);
      font-weight: 400;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    /* FORMAS GEOMÉTRICAS */
    .geo {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .diamond {
      position: absolute;
      width: 540px;
      height: 540px;
      left: 44%;
      top: 7%;
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 28px;
      transform: rotate(45deg);
    }

    .arc-big {
      position: absolute;
      width: 640px;
      height: 770px;
      left: 43%;
      top: -2%;
      border: 1.5px solid rgba(255,255,255,0.52);
      border-radius: 48%;
    }

    .loop-top {
      position: absolute;
      width: 195px;
      height: 235px;
      right: 14.6%;
      top: -2%;
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 50%;
    }

    .loop-bottom {
      position: absolute;
      width: 220px;
      height: 300px;
      right: 14%;
      top: 46%;
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 50% 50% 48% 54%;
    }

    /* máscara para simular o formato de "pin" */
    .loop-bottom::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 155px;
      bottom: -85px;
      left: 58px;
      background: transparent;
      border-right: 1.5px solid rgba(255,255,255,0.55);
      transform: rotate(36deg);
      transform-origin: top;
    }

    @media (max-width: 900px) {
      .diamond {
        width: 360px;
        height: 360px;
      }

      .arc-big {
        width: 430px;
        height: 550px;
      }

      .loop-top {
        width: 135px;
        height: 170px;
      }

      .loop-bottom {
        width: 155px;
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <main class="slide">

    <div class="frame"></div>
    <div class="corner-left"></div>
    <div class="corner-right"></div>

    <div class="top-line">
      RENTABILIDADE • CANAL VOZ • RÉGUAS &amp; CANAIS DIGITAIS • SQUAD PARCELE • SQUAD ACORDO
    </div>

    <div class="title">
      <div class="tribo">TRIBO</div>
      <div class="retencao">RETENÇÃO</div>
    </div>

    <div class="bottom-line">
      RENTABILIDADE • CANAL VOZ • RÉGUAS &amp; CANAIS DIGITAIS • SQUAD PARCELE • SQUAD ACORDO
    </div>

    <div class="geo">
      <div class="diamond"></div>
      <div class="arc-big"></div>
      <div class="loop-top"></div>
      <div class="loop-bottom"></div>
    </div>

  </main>

</body>
</html>
