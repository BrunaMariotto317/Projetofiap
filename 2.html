<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Design de Produtos e Centro de Excelência</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  body {
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #07113f;
  }

  /* =========================================================
     SLIDE 1920 x 1080
  ========================================================= */

  .slide {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #fff;
  }

  /* =========================================================
     AMBIENT LIGHT
     Glow bem suave, seguindo os outros slides
  ========================================================= */

  .glow {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(85px);
    opacity: .48;
  }

  .glow-01 {
    width: 430px;
    height: 430px;
    left: -180px;
    bottom: -130px;
    background: rgba(43, 147, 255, .16);
  }

  .glow-02 {
    width: 340px;
    height: 340px;
    left: 320px;
    bottom: -190px;
    background: rgba(117, 83, 255, .10);
  }

  .glow-03 {
    width: 320px;
    height: 320px;
    right: -120px;
    top: 300px;
    background: rgba(68, 124, 255, .08);
  }

  /* =========================================================
     HEADER
  ========================================================= */

  .header {
    position: absolute;
    top: 48px;
    left: 66px;
    right: 66px;
    height: 56px;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 18px;

    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: #111938;
  }

  .eyebrow-line {
    width: 6px;
    height: 40px;
    border-radius: 999px;
    background: #1769ff;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #050505;
  }

  .logo-word {
    text-align: right;
    line-height: .85;
  }

  .logo-word strong {
    display: block;
    font-family: Georgia, serif;
    font-size: 24px;
    letter-spacing: -0.04em;
  }

  .logo-word span {
    display: block;
    font-size: 14px;
    font-weight: 700;
  }

  .logo-symbol {
    position: relative;
    width: 46px;
    height: 36px;
  }

  .logo-symbol::before,
  .logo-symbol::after {
    content: "";
    position: absolute;
    top: 2px;
    width: 23px;
    height: 32px;
    background: #050505;
  }

  .logo-symbol::before {
    left: 0;
    clip-path: polygon(100% 0, 32% 0, 0 50%, 32% 100%, 100% 100%, 57% 50%);
  }

  .logo-symbol::after {
    right: 0;
    clip-path: polygon(0 0, 68% 0, 100% 50%, 68% 100%, 0 100%, 43% 50%);
  }

  /* =========================================================
     EDITORIAL NUMBER
  ========================================================= */

  .index {
    position: absolute;
    left: 82px;
    top: 240px;

    font-size: 17px;
    font-weight: 600;
    letter-spacing: .16em;
    color: #6d748a;
  }

  .big-number {
    position: absolute;
    left: 65px;
    top: 275px;

    font-size: 265px;
    line-height: .82;
    font-weight: 200;
    letter-spacing: -0.09em;

    color: #07113f;
  }

  .big-number span {
    color: #1769ff;
  }

  /* pequena assinatura visual */
  .accent {
    position: absolute;
    left: 72px;
    top: 545px;

    width: 90px;
    height: 5px;
    border-radius: 999px;
    background: #1769ff;
  }

  /* =========================================================
     NAVIGATION
  ========================================================= */

  .navigation {
    position: absolute;
    top: 235px;
    right: 145px;

    width: 900px;
  }

  .nav-item {
    position: relative;

    height: 116px;
    padding: 0 24px 0 0;

    display: grid;
    grid-template-columns: 86px 1fr 60px;
    align-items: center;

    border-bottom: 1px solid rgba(7, 17, 63, .28);

    transition: .3s ease;
  }

  .nav-number {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .05em;
    color: #8b91a4;
  }

  .nav-title {
    font-size: 27px;
    font-weight: 450;
    letter-spacing: -0.035em;
    color: #07113f;
  }

  /* =========================================================
     ARROW
  ========================================================= */

  .arrow {
    justify-self: end;

    width: 29px;
    height: 29px;

    position: relative;
  }

  .arrow::before {
    content: "";
    position: absolute;
    left: 1px;
    top: 13px;

    width: 24px;
    height: 2px;

    background: currentColor;
  }

  .arrow::after {
    content: "";
    position: absolute;
    right: 2px;
    top: 7px;

    width: 12px;
    height: 12px;

    border-top: 2px solid currentColor;
    border-right: 2px solid currentColor;

    transform: rotate(45deg);
  }

  /* =========================================================
     COLOR MOMENTS
     Não são todos cards / não é tudo degradê.
  ========================================================= */

  .nav-item:nth-child(2) .nav-number {
    color: #1769ff;
  }

  .nav-item:nth-child(3) {
    margin-top: 12px;
    margin-bottom: 12px;

    height: 108px;
    padding-left: 26px;

    border: 1px solid rgba(23, 105, 255, .12);
    border-radius: 24px;

    background: #eef5ff;
  }

  .nav-item:nth-child(3) .nav-number {
    color: #1769ff;
  }

  .nav-item:nth-child(3) .arrow {
    color: #1769ff;
  }

  .nav-item:nth-child(3) + .nav-item {
    border-top: 0;
  }

  /* último item = momento forte da composição */

  .nav-item:nth-child(6) {
    margin-top: 12px;

    height: 110px;
    padding-left: 26px;

    border: 0;
    border-radius: 24px;

    background: #07113f;
  }

  .nav-item:nth-child(6) .nav-number {
    color: #7298ff;
  }

  .nav-item:nth-child(6) .nav-title,
  .nav-item:nth-child(6) .arrow {
    color: #ffffff;
  }

  /* =========================================================
     SUBTLE LINE / DECORATION
  ========================================================= */

  .graphic-line {
    position: absolute;
    left: -120px;
    bottom: -230px;

    width: 700px;
    height: 700px;

    border: 1px solid rgba(7, 17, 63, .17);
    border-radius: 50%;
  }

  .graphic-line-2 {
    position: absolute;
    left: -250px;
    bottom: -365px;

    width: 870px;
    height: 870px;

    border: 1px solid rgba(23, 105, 255, .13);
    border-radius: 50%;
  }

  /* =========================================================
     SCALE PARA PREVIEW EM TELAS MENORES
  ========================================================= */

  .stage {
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
  }

  @media (max-width: 1919px), (max-height: 1079px) {
    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .stage {
      transform: scale(
        min(
          calc(100vw / 1920),
          calc(100vh / 1080)
        )
      );
    }
  }
</style>
</head>

<body>

<div class="stage">

  <main class="slide">

    <!-- AMBIENT GLOW -->
    <div class="glow glow-01"></div>
    <div class="glow glow-02"></div>
    <div class="glow glow-03"></div>

    <!-- HEADER -->
    <header class="header">

      <div class="eyebrow">
        <span class="eyebrow-line"></span>
        <span>Design de Produtos e Centro de Excelência</span>
      </div>

      <!-- Placeholder vetorial do logo -->
      <div class="logo">
        <div class="logo-word">
          <strong>Carrefour</strong>
          <span>banco</span>
        </div>

        <div class="logo-symbol"></div>
      </div>

    </header>

    <!-- EDITORIAL LEFT SIDE -->
    <div class="index">NAVEGAÇÃO</div>

    <div class="big-number">
      0<span>6</span>
    </div>

    <div class="accent"></div>

    <!-- NAVIGATION -->
    <section class="navigation">

      <div class="nav-item">
        <div class="nav-number">01</div>
        <div class="nav-title">Quem somos</div>
        <div class="arrow"></div>
      </div>

      <div class="nav-item">
        <div class="nav-number">02</div>
        <div class="nav-title">Nosso core</div>
        <div class="arrow"></div>
      </div>

      <div class="nav-item">
        <div class="nav-number">03</div>
        <div class="nav-title">Nosso objetivo</div>
        <div class="arrow"></div>
      </div>

      <div class="nav-item">
        <div class="nav-number">04</div>
        <div class="nav-title">Para onde vamos</div>
        <div class="arrow"></div>
      </div>

      <div class="nav-item">
        <div class="nav-number">05</div>
        <div class="nav-title">Ondas de atuação</div>
        <div class="arrow"></div>
      </div>

      <div class="nav-item">
        <div class="nav-number">06</div>
        <div class="nav-title">Nossos pilares</div>
        <div class="arrow"></div>
      </div>

    </section>

    <!-- BACKGROUND DETAIL -->
    <div class="graphic-line"></div>
    <div class="graphic-line-2"></div>

  </main>

</div>

</body>
</html>
